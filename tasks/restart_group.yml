---

- when: group is not defined
  ansible.builtin.debug:
    msg: "Skipping group restart (no group specified — full restart handled by restart_all)"

- when: group is defined
  include_tasks: "{{ role_path }}/tasks/restart_specified.yml"
  vars:
    systemd_services_list_on: "{{ systemd_services_list | selectattr('groups', 'contains', group) }}"
