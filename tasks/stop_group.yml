---

- when: group is not defined
  ansible.builtin.debug:
    msg: "Skipping group stop (no group specified — full stop handled by stop_all)"

- when: group is defined
  include_tasks: "{{ role_path }}/tasks/stop_specified.yml"
  vars:
    systemd_services_list_on: "{{ systemd_services_list | selectattr('groups', 'contains', group) }}"
